# Compose file para PRODUCCIÓN - Intranet ASSA
# =================================================
# Stack de producción para Intranet ASSA
# 
# Servicios principales:
# - Alfresco Content Services (ACS) - facuv/assa-intranet-acs-amd64
# - Alfresco Share - Interfaz web clásica
# - Alfresco Content App (ACA) - facuv/assa-intranet-aca-amd64
# - OOP Extension - facuv/assa-intranet-acs-oop-extension-amd64
# - PostgreSQL, Solr, ActiveMQ, Transform Core
# - Traefik como reverse proxy
#
# OOP Extension:
# Out-of-Process Extension que escucha eventos de Alfresco vía ActiveMQ
# y ejecuta lógica de negocio de forma independiente.
# - Java 21 con Virtual Threads
# - Escucha eventos: node.created, node.updated, node.deleted
# - Consume REST API de Alfresco
#
# Comando:
#   docker compose -f assa-compose.yaml up -d
#
# Nota: Este archivo debe ser modificado manualmente.
# Para implementar cambios del OOP Extension, contactar al equipo de desarrollo.
#
services:
  alfresco:
    image: facuv/assa-intranet-acs-amd64:latest
    mem_limit: 3g
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alfresco.rule=PathPrefix(`/alfresco`)"
      - "traefik.http.routers.alfresco.priority=100"
      - "traefik.http.services.alfresco.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.alfresco-root-redirect.redirectregex.regex=^https?://[^/]+/([^/.]+)$$"
      - "traefik.http.middlewares.alfresco-root-redirect.redirectregex.replacement=$$0/"
      - "traefik.http.middlewares.alfresco-chain.chain.middlewares=alfresco-root-redirect@docker"
      - "traefik.http.routers.alfresco.middlewares=alfresco-chain@docker"
      - "traefik.http.routers.solrapideny.rule=PathRegexp(`^/alfresco/(wc)?s(ervice)?/api/solr/.*$$`)"
      - "traefik.http.middlewares.acsfakeauth.basicauth.users=fake:"
      - "traefik.http.routers.solrapideny.middlewares=acsfakeauth@docker"
      - "traefik.http.routers.alfrescomicrometer.rule=PathRegexp(`^/alfresco/(wc)?s(ervice)?/prometheus`)"
      - "traefik.http.middlewares.prometheusipfilter.ipallowlist.sourcerange=127.0.0.0/8"
      - "traefik.http.routers.alfrescomicrometer.middlewares=prometheusipfilter@docker"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=10.197.50.103
        -Dshare.port=8080
        -Dalfresco.host=10.197.50.103
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://10.197.50.103:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dcollabora.public.url=https://office.aguassantafesinas.com.ar/
        -Dalfresco.public.url=https://acs.aguassantafesinas.com.ar/alfresco/
        -Dcom.sun.net.ssl.checkRevocation=false 
        -Djdk.tls.disabledAlgorithms=
        -Djdk.jar.disabledAlgorithms=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.0
    mem_limit: 2g
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    # estos healcheck no funcionaran asi. Incluirlo al proxy o exponer el puerto.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    depends_on:
      activemq:
        condition: service_healthy
  share:
    image: docker.io/alfresco/alfresco-share:26.1.0
    mem_limit: 1g
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.share.rule=PathPrefix(`/share`)"
      - "traefik.http.routers.share.priority=100"
      - "traefik.http.services.share.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.share-limit.buffering.maxRequestBodyBytes=5368709120"
      - "traefik.http.middlewares.share-root-redirect.redirectregex.regex=/share$$"
      - "traefik.http.middlewares.share-root-redirect.redirectregex.replacement=/share/"
      - "traefik.http.middlewares.share-chain.chain.middlewares=share-root-redirect@docker,share-limit@docker"
      - "traefik.http.routers.share.middlewares=share-chain@docker"
      - "traefik.http.routers.proxiedsolrapideny.rule=PathRegexp(`^/share/proxy/alfresco(-(noauth|feed|api))?/api/solr/`)"
      - "traefik.http.middlewares.sharefakeauth.basicauth.users=fake:"
      - "traefik.http.routers.proxiedsolrapideny.middlewares=sharefakeauth@docker"
    environment:
      CSRF_FILTER_ORIGIN: http://10.197.50.103:8080
      CSRF_FILTER_REFERER: http://10.197.50.103:8080/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=10.197.50.103
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 15s
    depends_on:
      alfresco:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: postgres:17.9
    mem_limit: 1g
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  solr6:
    image: docker.io/alfresco/alfresco-search-services:2.0.18
    mem_limit: 2g
    restart: unless-stopped
    environment:
      # Solr needs to know how to register itself with Alfresco
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      # Alfresco needs to know how to call solr
      SOLR_SOLR_HOST: "solr6"
      SOLR_SOLR_PORT: "8983"
      # Create the default alfresco and archive cores
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      # HTTPS or SECRET
      ALFRESCO_SECURE_COMMS: "secret"
      # SHARED SECRET VALUE
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    volumes:
      - solr-data:/opt/alfresco-search-services/data
      - solr-home:/opt/alfresco-search-services/solrhome
      - solr-keystores:/opt/alfresco-search-services/keystores
  activemq:
    image: alfresco/alfresco-activemq:6.2.1-jre17-rockylinux8
    mem_limit: 1g
    restart: unless-stopped
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    healthcheck:
      test:
        [
          "CMD",
          "/opt/activemq/bin/activemq",
          "query",
          "--objname",
          "type=Broker,brokerName=*,service=Health",
          "|",
          "grep",
          "Good",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - activemq-conf:/opt/activemq/conf
      - activemq-data:/opt/activemq/data
      - activemq-log:/var/log/activemq

  # ============================================================================
  # OOP EXTENSION - Out-of-Process Extension for Alfresco (PRODUCCIÓN)
  # ============================================================================
  # Servicio de extensión out-of-process que escucha eventos de Alfresco
  # a través de ActiveMQ y ejecuta lógica de negocio de forma independiente.
  #
  # NOTA DE IMPLEMENTACIÓN:
  # Este servicio requiere que la imagen Docker esté disponible en Docker Hub:
  #   facuv/assa-intranet-acs-oop-extension-amd64:latest
  #
  # Para actualizar la imagen en producción:
  #   1. Compilar nueva versión: ./build-push.sh <version> prod
  #   2. Actualizar tag en este archivo si es necesario
  #   3. Reiniciar servicio: docker compose -f assa-compose.yaml up -d oop-extension
  #
  # Health Check: http://localhost:9081/actuator/health
  # Logs: docker logs assa-oop-extension
  # ============================================================================
  oop-extension:
    image: facuv/assa-intranet-acs-oop-extension-amd64:latest
    container_name: assa-oop-extension
    mem_limit: 512m
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oop-extension.rule=PathPrefix(`/alfresco-oop`)"
      - "traefik.http.routers.oop-extension.priority=100"
      - "traefik.http.services.oop-extension.loadbalancer.server.port=8081"
      - "traefik.http.middlewares.oop-extension-stripprefix.stripprefix.prefixes=/alfresco-oop"
      - "traefik.http.routers.oop-extension.middlewares=oop-extension-stripprefix@docker"
    environment:
      # Spring Boot standard properties
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_ACTIVEMQ_BROKER_URL=tcp://activemq:61616
      - SPRING_ACTIVEMQ_USER=admin
      - SPRING_ACTIVEMQ_PASSWORD=admin
      # Alfresco REST API configuration
      - CONTENT_SERVICE_URL=http://alfresco:8080
      - CONTENT_SERVICE_SECURITY_BASICAUTH_USERNAME=admin
      - CONTENT_SERVICE_SECURITY_BASICAUTH_PASSWORD=admin
      # iTop API configuration
      - ITOP_API_URL=https://itopdes.aguassantafesinas.com.ar/webservices/rest.php
      - ITOP_AUTH_USER=Usritopapi
      - ITOP_AUTH_PWD=Carte123!
      - ITOP_API_VERSION=1.3
      # Tarifacion DB configuration
      - TARIFACION_DB_HOST=10.197.49.29
      - TARIFACION_DB_PORT=1433
      - TARIFACION_DB_NAME=Tarifacion
      - TARIFACION_DB_USER=x_fvelaz
      - TARIFACION_DB_PASSWORD=assa2026
      - TARIFACION_DB_ENABLED=true
      # JVM optimization
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    # Puerto expuesto solo para monitoreo interno (health checks)
    # No se expone externamente a través de Traefik por seguridad
    ports:
      - "127.0.0.1:9081:8081"
    depends_on:
      alfresco:
        condition: service_healthy
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  content-app:
    image: facuv/assa-intranet-aca-amd64:latest
    environment:
      APP_CONFIG_AUTH_TYPE: "BASIC"
      APP_CONFIG_ECM_HOST: "https://acs.aguassantafesinas.com.ar"
      APP_CONFIG_ITOP_PEOPLE_ENDPOINT: "/alfresco-oop/api/itop/data?className=Person"
    mem_limit: 1g
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aca.rule=PathPrefix(`/`)"
      - "traefik.http.routers.aca.priority=1"
      - "traefik.http.services.content-app.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s  

  proxy:
    image: traefik:3.1
    mem_limit: 256m
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=20m"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=20m"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=20m"
      - "--entryPoints.traefik.address=:8888"
      - "--accesslog=true"
      - "--providers.docker.exposedByDefault=false"
      - "--ping.entrypoint=web"
      - "--ping=true"
    ports:
      - "8080:8080"
      - "8888:8888"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  alfresco-data:
    external: true
  postgres-data:
    external: true
  solr-data:
    external: true
  solr-home:
    external: true
  solr-keystores:
    external: true
  activemq-conf:
    external: true
  activemq-data:
    external: true
  activemq-log:
    external: true
